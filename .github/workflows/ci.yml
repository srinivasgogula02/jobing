name: Code checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@11.6.2

      - name: Install locked dependencies
        # Sentry/Next's build toolchain contains both AJV 6 and AJV 8 peers.
        # Install the committed tree without platform-specific peer re-resolution.
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test:ci

      - name: Check TypeScript
        run: npm run typecheck
